[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SoundTouchBose"
version = "0.1.0"
description = "Local Bose SoundTouch preset and radio management desktop app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BSiggi" }]
dependencies = [
    "PySide6==6.11.1",
    "zeroconf==0.149.16",
    "requests==2.34.2",
    "websocket-client==1.9.0",
    "APScheduler==3.11.2",
    "Flask==3.1.3",
    "waitress==3.0.2",
    "pystray==0.19.5",
    "Pillow==12.2.0",
]

[project.scripts]
soundtouchbose = "soundtouchbose.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["soundtouchbose*"]

[tool.setuptools.package-data]
soundtouchbose = [
    "data/*.json",
    "gui/*.qss",
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "resources/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
